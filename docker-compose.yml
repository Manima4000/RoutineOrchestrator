name: rotinas

x-build: &build
  context: .
  args:
    BUILD_HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
    BUILD_HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}

x-ambiente: &ambiente
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Manaus
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  HOME: /home/airflow
  USER: airflow
  NO_PROXY: airflow-apiserver,postgres,mailpit,ssh-teste,localhost,127.0.0.1
  no_proxy: airflow-apiserver,postgres,mailpit,ssh-teste,localhost,127.0.0.1
  ROTINAS_DIR: /opt/airflow/dados/rotinas
  SCRIPTS_DIR: /opt/airflow/dados/scripts
  DADOS_DIR: /opt/airflow/dados
  SSH_KNOWN_HOSTS: /opt/airflow/ssh/known_hosts
  ROTINAS_LIB: /opt/rotinas/lib
  BACKUPS_DIR: /opt/airflow/backups
  PYTHONPATH: /opt/airflow/plugins:/opt/rotinas/lib

x-airflow: &airflow
  build: *build
  image: rotinas-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  env_file: .env
  environment: *ambiente
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - ${DADOS_HOST_DIR:-/opt/airflow-rotinas/dados}:/opt/airflow/dados
    - ./ssh:/opt/airflow/ssh
    - ./backups:/opt/airflow/backups
  networks: [rotinas]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    networks: [rotinas]
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        existentes="$$(airflow users list --output plain)"
        criar() { # criar USUARIO SENHA NOME SOBRENOME EMAIL (pula só se já existir; qualquer outra falha aborta)
          if echo "$$existentes" | grep -qw -- "$$1"; then
            echo "Usuário $$1 já existe."
          else
            airflow users create --username "$$1" --password "$$2" --firstname "$$3" --lastname "$$4" --role Admin --email "$$5"
          fi
        }
        criar "$${ADMIN_USUARIO}" "$${ADMIN_SENHA}" Admin Rotinas "$${ADMIN_EMAIL}"
        criar "$${AIRFLOW_API_USUARIO}" "$${AIRFLOW_API_SENHA}" Servico API "$${AIRFLOW_API_USUARIO}@localhost"
        # Connection do banco do Airflow (usada pela rotina de exemplo backup_banco_airflow);
        # importada de arquivo temporário 600 para a senha não aparecer na linha de comando.
        if airflow connections get postgres_airflow >/dev/null 2>&1; then
          echo "Connection postgres_airflow já existe."
        else
          umask 077
          python3 -c 'import json,os; print(json.dumps({"postgres_airflow": {"conn_type": "postgres", "host": "postgres", "port": 5432, "login": "airflow", "schema": "airflow", "password": os.environ["POSTGRES_PASSWORD"]}}))' > /tmp/conn_pg.json
          airflow connections import /tmp/conn_pg.json
          rm -f /tmp/conn_pg.json
        fi
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 12
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:latest
    profiles: [teste]
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [rotinas]

  ssh-teste:
    build: ./teste/ssh
    profiles: [teste]
    volumes:
      - ./teste/ssh/chave_teste.pub:/chave_teste.pub:ro
      - ./ssh:/chaves-ambiente:ro  # id_ambiente.pub (se existir) também é aceita
    networks: [rotinas]

  testes:
    <<: *airflow
    profiles: [teste]
    restart: "no"
    working_dir: /opt/airflow
    volumes:
      - ./plugins:/opt/airflow/plugins
      - ./dags:/opt/airflow/dags
      - ./scripts_base:/opt/airflow/scripts_base
      - ./tests:/opt/airflow/tests
      - ./pytest.ini:/opt/airflow/pytest.ini:ro
      - ./teste/ssh:/opt/airflow/teste/ssh:ro
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint", "bash", "-c", "exec \"$$@\"", "--"]  # passa pelo entrypoint do Airflow, que cria a entrada em /etc/passwd do uid (ssh exige)
    command: ["pytest"]
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      mailpit:
        condition: service_started
      ssh-teste:
        condition: service_started

networks:
  rotinas:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  postgres-dados:
