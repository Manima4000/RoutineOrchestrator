<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulo }} · Rotinas</title>
<style>
  :root { --borda: #d0d5dd; --texto: #1d2939; --suave: #667085; --azul: #1d4ed8; --verm: #b42318;
          --verm-fundo: #fef3f2; --amar-fundo: #fffaeb; --amar: #93370d; --verde: #027a48; --fundo: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--borda); background: var(--fundo); }
  header a.marca { font-weight: 600; font-size: 16px; color: var(--texto); text-decoration: none; }
  header .usuario { color: var(--suave); }
  main { padding: 20px 24px; max-width: 1200px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  a { color: var(--azul); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { font-weight: 600; color: var(--suave); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  .suave { color: var(--suave); }
  .botao, button { display: inline-block; padding: 6px 12px; border: 1px solid var(--borda); border-radius: 6px; background: #fff;
                   color: var(--texto); font: inherit; cursor: pointer; text-decoration: none; }
  .botao.primario, button.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .botao.perigo, button.perigo { background: var(--verm); border-color: var(--verm); color: #fff; }
  .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .acoes form { margin: 0; }
  .caixa { padding: 10px 14px; border-radius: 6px; margin: 0 0 16px; border: 1px solid; }
  .caixa.erro { background: var(--verm-fundo); border-color: #fecdca; color: var(--verm); }
  .caixa.aviso { background: var(--amar-fundo); border-color: #fedf89; color: var(--amar); }
  .selo { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--borda); }
  .selo.ativa { color: var(--verde); border-color: #a6f4c5; background: #ecfdf3; }
  .selo.inativa { color: var(--suave); }
  .divergente { color: var(--amar); font-size: 12px; }
  fieldset { border: 1px solid var(--borda); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; font-weight: 500; margin: 10px 0 4px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 6px 16px 6px 0; }
  input[type=text], input[type=number], textarea, select { font: inherit; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; }
  input[type=text], textarea { width: 100%; max-width: 640px; }
  input[type=number] { width: 90px; }
  textarea { min-height: 70px; }
  .ajuda { color: var(--suave); font-size: 12px; margin-top: 2px; }
  .erro-campo { color: var(--verm); font-size: 13px; margin-top: 4px; }
  .com-erro input, .com-erro textarea, .com-erro select { border-color: var(--verm); }
  .linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .linha > div > label { margin-top: 0; }
  .oculto { display: none !important; }
  .segredo { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .segredo input[type=text] { width: 200px; }
  pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; }
  ul.proximas { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<header>
  <a class="marca" href="{{ base }}/">Rotinas</a>
  {% if usuario %}<span class="usuario">Usuário: {{ usuario }}</span>{% endif %}
</header>
<main>
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
